  sample: 근육 하나 또는 한 무리가 갑자기 제멋대로 수축해 몹시 아픈 상태입니다. 쥐가 난 근육이 <b>눈에 보이거나 손으로 만져질 만큼 단단하게</b> 뭉칩니다. 수 초~수 분(드물게 10분) 이어지고, 풀린 뒤에도 누르면 아픈 통증·근육통이 <b>수 시간~48~72시간</b> 남을 수 있습니다. <span class="v2-noanchor">원문 근거(앵커 없음)</span>
