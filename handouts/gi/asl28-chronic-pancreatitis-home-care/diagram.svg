<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 170" role="img" aria-label="췌장 손상에서 통증, 소화효소 부족, 호르몬 부족으로 각각 나누어 보는 병렬 관계도" width="670.78125" height="170.078125"><style><![CDATA[
:root{
--color-canvas:#FFFFFF;
--color-danger:#B91C1C;
--color-danger-bg:#FEF2F2;
--color-ink:#1E293B;
--color-navy:#003366;
--color-steel:#5B9BD5;
--color-steel-deep:#2C5F8D;
--font-family:'Pretendard Variable', Pretendard, -apple-system,
                 BlinkMacSystemFont, system-ui, sans-serif;
}
svg{font-family:"Pretendard Variable", Pretendard, "Pretendard Variable", Pretendard, -apple-system, "system-ui", system-ui, sans-serif, sans-serif;font-feature-settings:"ss01", "tnum";}
.svg-label {font-family:inherit;font-size:17px;text-anchor:middle;fill:var(--color-navy);font-weight:600;}
.svg-small {font-family:inherit;font-size:16px;fill:var(--color-ink);text-anchor:middle;}
.node {fill:var(--color-canvas);stroke:var(--color-steel);stroke-width:2;}
.node-navy {fill:var(--color-navy);stroke:var(--color-navy);stroke-width:2;}
.node-alert {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
.connector {fill:none;stroke:var(--color-steel-deep);stroke-width:2;}
.arrow-fill {fill:var(--color-steel-deep);}
.trace {fill:none;stroke:var(--color-navy);stroke-width:3;stroke-linejoin:round;}
.trace-alert {fill:none;stroke:var(--color-danger);stroke-width:3;stroke-linejoin:round;}
.tissue {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
]]></style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="arrow-fill"/></marker></defs><rect x="14" y="55" width="195" height="60" rx="8" class="node"/><text x="111" y="92" class="svg-label">췌장 반복 손상</text><rect x="330" y="5" width="342" height="48" rx="8" class="node"/><text x="501" y="26" class="svg-label">섬유화·췌관 문제</text><text x="501" y="47" class="svg-small">통증</text><path d="M211 85 L326 29" class="connector" marker-end="url(#arrow)"/><rect x="330" y="61" width="342" height="48" rx="8" class="node"/><text x="501" y="82" class="svg-label">소화효소 부족</text><text x="501" y="103" class="svg-small">지방변·체중감소</text><path d="M211 85 L326 85" class="connector" marker-end="url(#arrow)"/><rect x="330" y="117" width="342" height="48" rx="8" class="node"/><text x="501" y="138" class="svg-label">호르몬 감소</text><text x="501" y="159" class="svg-small">당뇨·저혈당 위험</text><path d="M211 85 L326 141" class="connector" marker-end="url(#arrow)"/></svg>
