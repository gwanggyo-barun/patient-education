<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 170" role="img" aria-label="둥글고 긴 회충류와 편평한 마디 형태의 조충류 및 서로 다른 약물군을 연결하는 비교도" width="670.78125" height="170.078125"><style><![CDATA[
:root{
--color-canvas:#FFFFFF;
--color-danger:#B91C1C;
--color-danger-bg:#FEF2F2;
--color-ink:#1E293B;
--color-navy:#003366;
--color-steel:#5B9BD5;
--color-steel-deep:#2C5F8D;
--font-family:'Pretendard Variable', Pretendard, -apple-system,
                 BlinkMacSystemFont, system-ui, sans-serif;
}
svg{font-family:"Pretendard Variable", Pretendard, "Pretendard Variable", Pretendard, -apple-system, "system-ui", system-ui, sans-serif, sans-serif;font-feature-settings:"ss01", "tnum";}
.svg-label {font-family:inherit;font-size:17px;text-anchor:middle;fill:var(--color-navy);font-weight:600;}
.svg-small {font-family:inherit;font-size:16px;fill:var(--color-ink);text-anchor:middle;}
.node {fill:var(--color-canvas);stroke:var(--color-steel);stroke-width:2;}
.node-navy {fill:var(--color-navy);stroke:var(--color-navy);stroke-width:2;}
.node-alert {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
.connector {fill:none;stroke:var(--color-steel-deep);stroke-width:2;}
.arrow-fill {fill:var(--color-steel-deep);}
.trace {fill:none;stroke:var(--color-navy);stroke-width:3;stroke-linejoin:round;}
.trace-alert {fill:none;stroke:var(--color-danger);stroke-width:3;stroke-linejoin:round;}
.tissue {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
]]></style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="arrow-fill"/></marker></defs><rect x="12" y="10" width="318" height="146" rx="8" class="node"/><rect x="356" y="10" width="318" height="146" rx="8" class="node"/><path d="M50 69Q85 14 125 65T206 68T291 57" class="trace"/><rect x="383" y="49" width="27" height="24" rx="3" class="node"/><rect x="411" y="49" width="27" height="24" rx="3" class="node"/><rect x="439" y="49" width="27" height="24" rx="3" class="node"/><rect x="467" y="49" width="27" height="24" rx="3" class="node"/><rect x="495" y="49" width="27" height="24" rx="3" class="node"/><rect x="523" y="49" width="27" height="24" rx="3" class="node"/><rect x="551" y="49" width="27" height="24" rx="3" class="node"/><rect x="579" y="49" width="27" height="24" rx="3" class="node"/><rect x="607" y="49" width="27" height="24" rx="3" class="node"/><text x="171" y="108" class="svg-label">둥글고 길다</text><text x="171" y="136" class="svg-small">회충류 → 알벤다졸</text><text x="515" y="108" class="svg-label">납작하고 마디가 있다</text><text x="515" y="136" class="svg-small">조충류 → 프라지콴텔</text></svg>
