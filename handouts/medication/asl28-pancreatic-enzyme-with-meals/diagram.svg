<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 170" role="img" aria-label="췌장효소제를 식사 시작과 중간, 긴 식사 동안 나누어 먹는 시간 흐름도" width="670.78125" height="170.078125"><style><![CDATA[
:root{
--color-canvas:#FFFFFF;
--color-danger:#B91C1C;
--color-danger-bg:#FEF2F2;
--color-ink:#1E293B;
--color-navy:#003366;
--color-steel:#5B9BD5;
--color-steel-deep:#2C5F8D;
--font-family:'Pretendard Variable', Pretendard, -apple-system,
                 BlinkMacSystemFont, system-ui, sans-serif;
}
svg{font-family:"Pretendard Variable", Pretendard, "Pretendard Variable", Pretendard, -apple-system, "system-ui", system-ui, sans-serif, sans-serif;font-feature-settings:"ss01", "tnum";}
.svg-label {font-family:inherit;font-size:17px;text-anchor:middle;fill:var(--color-navy);font-weight:600;}
.svg-small {font-family:inherit;font-size:16px;fill:var(--color-ink);text-anchor:middle;}
.node {fill:var(--color-canvas);stroke:var(--color-steel);stroke-width:2;}
.node-navy {fill:var(--color-navy);stroke:var(--color-navy);stroke-width:2;}
.node-alert {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
.connector {fill:none;stroke:var(--color-steel-deep);stroke-width:2;}
.arrow-fill {fill:var(--color-steel-deep);}
.trace {fill:none;stroke:var(--color-navy);stroke-width:3;stroke-linejoin:round;}
.trace-alert {fill:none;stroke:var(--color-danger);stroke-width:3;stroke-linejoin:round;}
.tissue {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
]]></style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="arrow-fill"/></marker></defs><rect x="14.0" y="26" width="202.66666666666666" height="110" rx="8" class="node"/><path d="M218.66666666666666 81 L240.66666666666666 81" class="connector" marker-end="url(#arrow)"/><text x="115.33333333333333" y="65" class="svg-label">식사 시작</text><text x="115.33333333333333" y="94" class="svg-label">일부 복용</text><rect x="242.66666666666666" y="26" width="202.66666666666666" height="110" rx="8" class="node"/><path d="M447.3333333333333 81 L469.3333333333333 81" class="connector" marker-end="url(#arrow)"/><text x="344.0" y="65" class="svg-label">식사 중간</text><text x="344.0" y="94" class="svg-label">나누어 복용</text><rect x="471.3333333333333" y="26" width="202.66666666666666" height="110" rx="8" class="node"/><text x="572.6666666666666" y="65" class="svg-label">긴 식사</text><text x="572.6666666666666" y="94" class="svg-label">분할 복용</text></svg>
