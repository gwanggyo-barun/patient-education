<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 170" role="img" aria-label="금연과 운동, 예방접종, 흡입 기관지확장제를 함께 연결하는 COPD 관리도" width="670.78125" height="170.078125"><style><![CDATA[
:root{
--color-canvas:#FFFFFF;
--color-danger:#B91C1C;
--color-danger-bg:#FEF2F2;
--color-ink:#1E293B;
--color-navy:#003366;
--color-steel:#5B9BD5;
--color-steel-deep:#2C5F8D;
--font-family:'Pretendard Variable', Pretendard, -apple-system,
                 BlinkMacSystemFont, system-ui, sans-serif;
}
svg{font-family:"Pretendard Variable", Pretendard, "Pretendard Variable", Pretendard, -apple-system, "system-ui", system-ui, sans-serif, sans-serif;font-feature-settings:"ss01", "tnum";}
.svg-label {font-family:inherit;font-size:17px;text-anchor:middle;fill:var(--color-navy);font-weight:600;}
.svg-small {font-family:inherit;font-size:16px;fill:var(--color-ink);text-anchor:middle;}
.node {fill:var(--color-canvas);stroke:var(--color-steel);stroke-width:2;}
.node-navy {fill:var(--color-navy);stroke:var(--color-navy);stroke-width:2;}
.node-alert {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
.connector {fill:none;stroke:var(--color-steel-deep);stroke-width:2;}
.arrow-fill {fill:var(--color-steel-deep);}
.trace {fill:none;stroke:var(--color-navy);stroke-width:3;stroke-linejoin:round;}
.trace-alert {fill:none;stroke:var(--color-danger);stroke-width:3;stroke-linejoin:round;}
.tissue {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
]]></style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="arrow-fill"/></marker></defs><rect x="233" y="55" width="222" height="62" rx="8" class="node"/><text x="344" y="93" class="svg-label">COPD 지속 관리</text><rect x="14" y="8" width="185" height="54" rx="8" class="node"/><text x="106" y="41" class="svg-label">금연</text><path d="M199 35 L231 75" class="connector" marker-end="url(#arrow)"/><rect x="14" y="105" width="185" height="54" rx="8" class="node"/><text x="106" y="138" class="svg-label">운동·호흡재활</text><path d="M199 132 L231 100" class="connector" marker-end="url(#arrow)"/><rect x="489" y="8" width="185" height="54" rx="8" class="node"/><text x="581" y="41" class="svg-label">호흡기 백신</text><path d="M489 35 L457 75" class="connector" marker-end="url(#arrow)"/><rect x="489" y="105" width="185" height="54" rx="8" class="node"/><text x="581" y="138" class="svg-label">흡입 기관지확장제</text><path d="M489 132 L457 100" class="connector" marker-end="url(#arrow)"/></svg>
