<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 170" role="img" aria-label="항체 검사와 임상 증상, 진찰 및 영상을 종합하는 자가항체 결과 해석 과정" width="670.78125" height="170.078125"><style><![CDATA[
:root{
--color-canvas:#FFFFFF;
--color-danger:#B91C1C;
--color-danger-bg:#FEF2F2;
--color-ink:#1E293B;
--color-navy:#003366;
--color-steel:#5B9BD5;
--color-steel-deep:#2C5F8D;
--font-family:'Pretendard Variable', Pretendard, -apple-system,
                 BlinkMacSystemFont, system-ui, sans-serif;
}
svg{font-family:"Pretendard Variable", Pretendard, "Pretendard Variable", Pretendard, -apple-system, "system-ui", system-ui, sans-serif, sans-serif;font-feature-settings:"ss01", "tnum";}
.svg-label {font-family:inherit;font-size:17px;text-anchor:middle;fill:var(--color-navy);font-weight:600;}
.svg-small {font-family:inherit;font-size:16px;fill:var(--color-ink);text-anchor:middle;}
.node {fill:var(--color-canvas);stroke:var(--color-steel);stroke-width:2;}
.node-navy {fill:var(--color-navy);stroke:var(--color-navy);stroke-width:2;}
.node-alert {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
.connector {fill:none;stroke:var(--color-steel-deep);stroke-width:2;}
.arrow-fill {fill:var(--color-steel-deep);}
.trace {fill:none;stroke:var(--color-navy);stroke-width:3;stroke-linejoin:round;}
.trace-alert {fill:none;stroke:var(--color-danger);stroke-width:3;stroke-linejoin:round;}
.tissue {fill:var(--color-danger-bg);stroke:var(--color-danger);stroke-width:2;}
]]></style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="arrow-fill"/></marker></defs><rect x="13" y="28" width="190" height="76" rx="8" class="node"/><rect x="249" y="28" width="190" height="76" rx="8" class="node"/><rect x="485" y="28" width="190" height="76" rx="8" class="node"/><text x="108" y="61" class="svg-label">자가항체</text><text x="108" y="86" class="svg-small">RF·ANA 결과</text><text x="344" y="61" class="svg-label">몸의 증상</text><text x="344" y="86" class="svg-small">관절·피부·건조</text><text x="580" y="61" class="svg-label">진찰·영상</text><text x="580" y="86" class="svg-small">종합 평가</text><path d="M204 66 L246 66" class="connector" marker-end="url(#arrow)"/><path d="M440 66 L482 66" class="connector" marker-end="url(#arrow)"/><text x="344" y="149" class="svg-small">양성만으로 확정하지 않고 음성만으로 배제하지 않습니다</text></svg>
